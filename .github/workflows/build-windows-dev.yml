# ============================================================
#  Workflow: Build Dev (neo-dev / 开发版)
#
#  职责：
#    - 监听「开发分支 neo-dev」的 push，自动构建 Windows 安装包
#    - 仅上传构建 artifact，**不发布 Release**
#
#  输出：
#    - Artifact: windows-zip-dev（dist/*.zip + dist/version.yml）
#
#  权限：contents: read —— 不发布，只需读取 + 上传 artifact
# ============================================================
name: Build Dev (neo-dev)

on:
  push:
    branches:
      - neo-dev

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: C:\\Users\\runneradmin\\AppData\\Local\\electron-builder\\Cache
          ELECTRON_CACHE: C:\\Users\\runneradmin\\AppData\\Local\\electron\\Cache
        run: npm run build

      - name: Generate version metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $commit = "${{ github.sha }}"
          $content = @"
          version: "$version"
          commit: "$commit"
          type: "dev"
          "@
          $content | Out-File -FilePath dist\version.yml -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-dev
          path: |
            dist\*.zip
            dist\version.yml
          if-no-files-found: error
