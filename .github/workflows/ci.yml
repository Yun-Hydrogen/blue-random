# ============================================================
#  Workflow: CI Build (标准持续集成构建)
#
#  触发条件：
#    - 自动触发：push 事件（任意分支推送自动触发）与 pull_request
#    - 手动触发：workflow_dispatch (支持手动触发验证构建)
#  职责：
#    - 自动编译 Vue 3 前端静态产物 (Vite)
#    - 还原 .NET 解决方案并执行 xUnit 单元测试保障质量
#    - 编译并输出单文件独立版 Windows 构建产物 (.NET 10 / win-x64)
#    - 自动上传构建产物 (Artifact) 输出结果供下载测试
# ============================================================
name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build WebUI (Vite)
        run: npm run build:vite

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Solution
        run: dotnet restore BlueRandom.sln

      - name: Run Unit Tests
        run: dotnet test tests/BlueRandom.Tests/BlueRandom.Tests.csproj --configuration Release --verbosity normal

      - name: Publish Single-File Standalone (win-x64)
        run: >
          dotnet publish src-csharp/BlueRandom.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/ci

      - name: Prepare CI Output
        shell: pwsh
        run: |
          $json = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $json.version
          $code = if ($json.codename) { $json.codename } else { "Dev" }
          New-Item -ItemType Directory -Force -Path publish\out | Out-Null
          $targetExe = "publish\out\BlueRandom-$code-v$ver-CI-win-x64.exe"
          Copy-Item "publish\ci\BlueRandom.exe" $targetExe
          if (Test-Path changelog.md) {
            Copy-Item "changelog.md" "publish\out\changelog.md"
          }
          Write-Host "CI Build Output prepared at $targetExe"

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlueRandom-CI-Windows
          path: publish/out/*
          if-no-files-found: error
