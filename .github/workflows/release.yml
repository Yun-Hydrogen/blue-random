# ============================================================
#  Workflow: Release (手动触发生产发布)
#
#  触发条件：
#    - 仅手动触发：workflow_dispatch (手动点击 Run workflow 触发)
#  职责：
#    - 读取 package.json 中的 codename (版本代号) 与 version (版本号)
#    - 编译前端 Vite 静态产物
#    - 执行全部 xUnit 自动化测试确保发布质量
#    - 构建单文件独立版可执行文件 (.NET 10 / win-x64)
#    - 按照「代号+版本号」格式生成标签、Release 标题与二进制文件名
#    - 自动创建并发布 GitHub Release
# ============================================================
name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      draft:
        description: '是否先保存为草稿 (Draft Release)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build WebUI (Vite)
        run: npm run build:vite

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Solution
        run: dotnet restore BlueRandom.sln

      - name: Run Unit Tests
        run: dotnet test tests/BlueRandom.Tests/BlueRandom.Tests.csproj --configuration Release --verbosity normal

      - name: Resolve Version and Codename
        id: meta
        shell: pwsh
        run: |
          $json = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $json.version
          $code = if ($json.codename) { $json.codename } else { "Release" }
          $tag = "$code-v$ver"
          $title = "蔚蓝点名 Blue Random [$code] v$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "codename=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved metadata: Codename=[$code], Version=[$ver], Tag=[$tag]"

      - name: Publish Single-File Standalone (win-x64)
        run: >
          dotnet publish src-csharp/BlueRandom.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/release

      - name: Package Single-File Release
        shell: pwsh
        run: |
          $code = "${{ steps.meta.outputs.codename }}"
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path publish\out | Out-Null
          $targetExe = "publish\out\BlueRandom-$code-v$ver-win-x64.exe"
          Copy-Item "publish\release\BlueRandom.exe" $targetExe
          Write-Host "Prepared package: $targetExe"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlueRandom-${{ steps.meta.outputs.tag_name }}-Windows
          path: publish/out/BlueRandom-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: publish/out/BlueRandom-*.exe
